apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: lovable-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: vikashpal28/lovable-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -XX:TieredStopAtLevel=1 -Dspring.main.lazy-initialization=true"
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: CONFIG_SERVER_URL
              value: http://config-service.lovable-core.svc.cluster.local:8888
            - name: SPRING_CLOUD_CONFIG_FAIL_FAST
              value: "false"
            - name: SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS
              value: "10"
            - name: SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            
            # ─── FORCE STRIP STREAM TIMEOUTS DIRECTLY VIA ENV ───
            - name: SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT
              value: "300s"
            - name: SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT
              value: "10000"

          resources:
            requests:
              cpu: 50m       # Slightly bumped to protect Netty polling loops
              memory: 180Mi
            limits:
              cpu: 300m
              memory: 512Mi   # Increased limit to prevent OOM errors during concurrent stream loads
          
          # Hardened readiness probe settings for streaming endpoints
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 10 # Raised from 5s to stop false-positives under high pool loads
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: lovable-core
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080