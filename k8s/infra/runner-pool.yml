apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-pool
  namespace: lovable-previews
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runner
      status: idle
  template:
    metadata:
      labels:
        app: runner
        status: idle
    spec:
      volumes:
        - name: workspace
          emptyDir: {}
      containers:
        # --- 1. THE DYNAMIC RUNNER ---
        - name: runner
          image: node:20-alpine
          workingDir: /app
          # Keep the pool alive and generic at boot
          command: ["/bin/sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: workspace
              mountPath: /app
          ports:
            - containerPort: 5173
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

        # --- 2. THE DYNAMIC SYNCER ---
        - name: syncer
          image: minio/mc
          workingDir: /app
          # Pre-configured with MinIO access, waiting for the dynamic sync command
          command: ["/bin/sh", "-c", "sleep infinity"]
          env:
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MC_HOST_myminio
              value: "http://$(MINIO_USER):$(MINIO_PASS)@minio.lovable-core.svc.cluster.local:9000"
          volumeMounts:
            - name: workspace
              mountPath: /app
          resources:
            requests:
              memory: "30Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "100m"